aid: bharti-airtel
url: https://raw.githubusercontent.com/api-evangelist/bharti-airtel/refs/heads/main/apis.yml
name: Bharti Airtel
kind: company
description: >-
  Bharti Airtel Limited is an Indian multinational telecommunications operator
  headquartered in New Delhi, and one of the two dominant mobile network
  operators in its home market of India alongside Reliance Jio. It runs mobile
  (2G/4G/5G), fixed broadband, DTH television, enterprise connectivity, data
  centre (Nxtra) and payments-bank businesses across India, South Asia and —
  through the separately listed Airtel Africa — fourteen African countries.
  In the telecom value chain Airtel is an access-network owner: it holds the
  spectrum, the SIM estate, the subscriber identity and the network signalling
  that the rest of the industry resells. Its API posture is split in two, and
  the split is the whole story. The connectivity-product side is genuinely
  API-native and publicly documented: Airtel IQ, the operator's CPaaS suite,
  publishes open Swagger for its SMS and CDR reporting APIs and offers a
  self-serve trial account, while the Airtel IoT and Airtel Locate developer
  portals publish complete OpenAPI 3.0 catalogues (43 and 19 operations) as
  Redoc pages that need no login. The network-API side — the CAMARA and GSMA
  Open Gateway surface that defines this sector — is the opposite: Airtel is a
  GSMA Open Gateway signatory, a founding operator shareholder in Aduna (the
  Ericsson-led network-API joint venture), and has commercially launched a
  CAMARA SIM Swap API to Indian banks through a federated Jio/Vi/Airtel
  channel, yet it publishes no CAMARA endpoint, no CAMARA specification, no
  CIBA authorization surface and no network-API developer portal of its own.
  Developers reach Airtel's network capabilities only through aggregators —
  Aduna, and Nokia's Network as Code platform — never directly. Its own
  "Airtel API Marketplace" at developers.airtel.in is a login wall, and its
  original 2017 Smart API partner programme at openapi.airtel.in/smartapi
  survives as an unmaintained legacy portal.
