apis:
- aid: bharti-airtel:airtel-smart-api
  name: Airtel Smart API (legacy)
  description: >-
    Airtel's original partner developer programme, launched in 2017 and now an unmaintained legacy portal
    (the site still carries a 2017 copyright). Its public documentation still describes real OAuth 2.0
    authorization-code and implicit grant flows and three partner services — carrier-billing charge, subscription
    activation/deactivation, and an LRN (local routing number) and porting lookup — plus an Aadhaar/UIDAI
    DigiAuth authentication and e-KYC integration. Production host is not published; documented endpoints
    use an <IP>:<Port> placeholder and access is granted only after partner registration, so no specification
    was harvestable.
  humanURL: https://openapi.airtel.in/smartapi/#/docs
