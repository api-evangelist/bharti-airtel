apis:
  - aid: bharti-airtel:airtel-iq-sms-api
    name: Airtel IQ SMS API
    description: >-
      The messaging half of Airtel IQ, Airtel's network-embedded CPaaS suite.
      Sends single, bulk, CSV-batch and content-moderated A2P SMS over Airtel's
      pan-India network, with TRAI DLT (Hyperledger-based distributed ledger)
      scrubbing for sender header, content template and consent compliance
      applied in-path. Authenticated with HTTP Basic using API-key credentials
      issued from the Airtel IQ dashboard. Swagger 2.0 published openly at
      openapi.airtel.in.
    humanURL: https://www.airtel.in/business/b2b/airtel-iq/api-docs/sms/sms-utility
    baseURL: https://iqsms.airtel.in/api/v1
    tags:
      - Messaging
      - SMS
      - CPaaS
      - India
    properties:
      - type: Documentation
        url: https://www.airtel.in/business/b2b/airtel-iq/api-docs/sms/overview
      - type: APIReference
        url: https://www.airtel.in/business/b2b/airtel-iq/api-docs/sms/sms-utility
      - type: OpenAPI
        url: openapi/bharti-airtel-iq-sms-openapi.yml
      - type: Overlay
        url: overlays/bharti-airtel-iq-sms-overlay.yaml
      - type: SignUp
        url: https://www.airtel.in/business/b2b/airtel-ccp/dashboard/#/signup
  - aid: bharti-airtel:airtel-iq-reporting-api
    name: Airtel IQ Reporting API
    description: >-
      The Call Detail Record (CDR) reporting surface of Airtel IQ. Returns
      detailed per-call records — time, date, duration, caller ID, destination
      number, status and call-recording URL — for voice traffic placed through
      Airtel IQ Intelliphones and call flows. Swagger 2.0 published openly at
      openapi.airtel.in.
    humanURL: https://www.airtel.in/business/b2b/airtel-iq/api-docs/voice/sample-cdr
    baseURL: https://openapi.airtel.in/gateway/airtel-xchange-reporting/v2
    tags:
      - Voice
      - Reporting
      - CDR
      - CPaaS
    properties:
      - type: Documentation
        url: https://www.airtel.in/business/b2b/airtel-iq/api-docs/voice/overview
      - type: APIReference
        url: https://www.airtel.in/business/b2b/airtel-iq/api-docs/voice/sample-cdr
      - type: OpenAPI
        url: openapi/bharti-airtel-iq-reporting-openapi.yml
      - type: Overlay
        url: overlays/bharti-airtel-iq-reporting-overlay.yaml
  - aid: bharti-airtel:airtel-iot-api
    name: Airtel IoT API
    description: >-
      Airtel's IoT/M2M connectivity-management API, published as a complete
      OpenAPI 3.0.1 catalogue of 43 operations across ten areas: account
      authorization, account details, inventory management, SIM lifecycle
      (activate, swap, change plan, safe custody, temporary disconnection),
      bulk SIM lifecycle, job status, device and session information, SMS and
      voice whitelisting, KYC management, and a messaging centre. Authenticated
      with OAuth 2.0 client-credentials against /auth/v2/generate/authtoken with
      refresh-token support. Documented publicly with Redoc, no login required.
    humanURL: https://www.airtel.in/m2m/business/b2b/m2m-solutions/documentation/m2m-solutions/
    baseURL: https://m2m.airteliot.co.in/iot/api/
    tags:
      - IoT
      - M2M
      - SIM Management
      - Connectivity
      - eSIM
      - KYC
    properties:
      - type: Documentation
        url: https://www.airtel.in/m2m/business/b2b/m2m-solutions/documentation/m2m-solutions/
      - type: APIReference
        url: https://www.airtel.in/m2m/business/b2b/m2m-solutions/documentation/m2m-solutions/
      - type: OpenAPI
        url: openapi/bharti-airtel-iot-openapi.yml
      - type: Overlay
        url: overlays/bharti-airtel-iot-overlay.yaml
  - aid: bharti-airtel:airtel-locate-api
    name: Airtel Locate API
    description: >-
      Airtel Locate is the operator's network-based device-location platform,
      letting enterprises track a device by MSISDN without relying on the
      device's GPS. Published as an OpenAPI 3.0.0 catalogue (version 1.4.8) of
      19 operations across five areas — Authorization, Resource Consent,
      Location, Address Validation and Tenant management — with explicit
      subscriber consent capture and an asynchronous mode that posts location
      to a customer-registered callback listener. This is Airtel's proprietary
      location API, not the CAMARA Device Location or Location Verification
      API. Documented publicly with Redoc, no login required.
    humanURL: https://www.airtel.in/m2m/business/b2b/locate-solution/documentation/locate-solution/
    baseURL: https://openapi.airtel.in/locate/apis
    tags:
      - Device Location
      - Consent Management
      - IoT
      - Location
      - Address Validation
    properties:
      - type: Documentation
        url: https://www.airtel.in/m2m/business/b2b/locate-solution/documentation/locate-solution/
      - type: APIReference
        url: https://www.airtel.in/m2m/business/b2b/locate-solution/documentation/locate-solution/
      - type: OpenAPI
        url: openapi/bharti-airtel-locate-openapi.yml
      - type: Overlay
        url: overlays/bharti-airtel-locate-overlay.yaml
  - aid: bharti-airtel:airtel-smart-api
    name: Airtel Smart API (legacy)
    description: >-
      Airtel's original partner developer programme, launched in 2017 and now
      an unmaintained legacy portal (the site still carries a 2017 copyright).
      Its public documentation still describes real OAuth 2.0 authorization-code
      and implicit grant flows and three partner services — carrier-billing
      charge, subscription activation/deactivation, and an LRN (local routing
      number) and porting lookup — plus an Aadhaar/UIDAI DigiAuth
      authentication and e-KYC integration. Production host is not published;
      documented endpoints use an <IP>:<Port> placeholder and access is
      granted only after partner registration, so no specification was
      harvestable.
    humanURL: https://openapi.airtel.in/smartapi/#/docs
    tags:
      - Carrier Billing
      - Subscriptions
      - Identity Verification
      - Legacy
      - OAuth
    properties:
      - type: Documentation
        url: https://openapi.airtel.in/smartapi/#/docs
      - type: APIReference
        url: https://openapi.airtel.in/smartapi/#/docs/subscriptions
      - type: Documentation
        url: https://openapi.airtel.in/smartapi/#/docs/payment
      - type: Documentation
        url: https://openapi.airtel.in/smartapi/#/docs/UIDAI
      - type: Documentation
        url: https://openapi.airtel.in/smartapi/#/docs/developerAuth
