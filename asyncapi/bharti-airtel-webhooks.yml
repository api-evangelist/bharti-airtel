asyncapi_note: >-
  No AsyncAPI document is published for any Airtel event surface. /asyncapi.yaml and /asyncapi.json
  return 404 on openapi.airtel.in and m2m.airteliot.co.in, and return HTTP 200 with the 8,991-byte
