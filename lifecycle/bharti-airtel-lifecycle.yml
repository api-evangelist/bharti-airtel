    introduced, supported or retired.
deprecation:
  policy_url: null
  policy_published: false
  sunset_header: false
  deprecation_header: false
  deprecated_operations: []
  note: >-
    RFC 8594 Sunset and RFC 9745 Deprecation headers appear nowhere. Every operation in all four
    specifications carries an explicit `deprecated: false`, so the estate declares no deprecated
    operation — but there is also no published policy telling a consumer what warning they would
    get. The legacy Smart API programme at openapi.airtel.in/smartapi is the counter-example: it
    was never formally deprecated, it was simply abandoned in place (2017 copyright, assets stamped
    19Jul17) and still serves documentation today.
