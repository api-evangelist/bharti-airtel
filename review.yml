aid: bharti-airtel
name: Bharti Airtel
review:
  question: >-
    Does Bharti Airtel expose a real, self-serve, publicly documented API surface —
    and what is its CAMARA / GSMA Open Gateway posture?
  answer: partial
  date: '2026-07-25'
  reviewer: API Evangelist
  homeMarket: India
  tier: mno-carrier
  gated: false
  gatedNote: >-
    Marked not-gated because the product-connectivity documentation (Airtel IQ,
    Airtel IoT, Airtel Locate) is genuinely public and a self-serve trial exists.
    The network/CAMARA surface is fully gated and the "Airtel API Marketplace"
    is a login wall — both recorded below.
findings:
  summary: |
    Bharti Airtel is a split case, and the split runs exactly along the line this
    sector study predicts. Airtel's CONNECTIVITY PRODUCT APIs are real, public and
    specification-backed: four OpenAPI/Swagger documents were harvested anonymously,
    two of them complete OpenAPI 3.0 catalogues. Airtel's NETWORK APIs — the CAMARA
    and GSMA Open Gateway surface that is the defining signal of this sector — are
    entirely unreachable from Airtel directly. There is no CAMARA endpoint, no CAMARA
    specification, no CIBA authorization surface, and no network-API developer portal
    on any airtel.in host. Airtel's commercially launched CAMARA SIM Swap API is sold
    to Indian banks through a GSMA-certified federated Jio/Vi/Airtel channel, and its
    wider network capability reaches developers through Aduna (in which Airtel is a
    founding operator shareholder) and through Nokia's Network as Code platform. The
    aggregator owns the developer relationship; Airtel owns the network.
  developerPortals:
    - url: https://www.airtel.in/business/b2b/airtel-iq/api-docs/sms/sms-utility
      status: 200
      verdict: real-self-serve
      note: >-
        Airtel IQ API documentation (React SPA under assets.airtel.in/static-assets/
        airtel-ccp/api-docs). Public, no login. Renders Swagger fetched live from
        openapi.airtel.in. Sibling routes /sms/overview, /voice/overview,
        /voice/callflow-api, /voice/sample-cdr, /whatsapp/whatsapp-api, /rcs/rcs-api
        all return 200. A self-serve trial account (1 Intelliphone + 500 free pulses)
        is offered at the CPaaS dashboard signup.
    - url: https://www.airtel.in/m2m/business/b2b/m2m-solutions/documentation/m2m-solutions/
      status: 200
      verdict: real-public-reference
      note: >-
        "Dev Portal - Airtel Iot". Server-rendered Redoc (v2.2.0) page, 743 KB, with a
        complete OpenAPI 3.0.1 document embedded in __redoc_state. No login required to
        read; production credentials are enterprise-issued.
    - url: https://www.airtel.in/m2m/business/b2b/locate-solution/documentation/locate-solution/
      status: 200
      verdict: real-public-reference
      note: >-
        "Dev Portal - Locate Api Catalog". Server-rendered Redoc (v2.1.3) page, 275 KB,
        with a complete OpenAPI 3.0.0 document (v1.4.8) embedded in __redoc_state.
    - url: https://developers.airtel.in/
      status: 200
      verdict: login-wall
      note: >-
        "Airtel API Marketplace". React SPA shell only (1,647 bytes); every route
        (/products, /gettingstarted, /register) returns the same shell. Meta description
        reads "Login to Airtel API Marketplace portal for any API related buy." Backend is
        https://m2m.airteliot.co.in/ and its catalogue call /api/auth/list returns HTTP 401
        anonymously. Ships RapiDoc, so specifications exist behind the wall but are not
        served to anonymous callers.
    - url: https://openapi.airtel.in/smartapi/
      status: 200
      verdict: legacy-abandoned
      note: >-
        "Smart API" — Airtel's original 2017 partner developer programme. AngularJS
        application, footer reads "© Airtel India 2017", asset pageVersion '19Jul17'.
        Still serves real public documentation (OAuth flows, carrier billing, subscription,
        LRN lookup, UIDAI/Aadhaar DigiAuth) but production hosts are redacted to
        <IP>:<Port> and access requires partner registration.
