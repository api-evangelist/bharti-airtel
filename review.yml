actions:
  openapiHarvested: 4
  openapiDirectory: openapi/
  originalsPreserved: openapi/_original/
  apisYmlCreated: true
  reason: >-
    Four genuine specifications were harvested anonymously and Airtel's CAMARA posture was
    established from primary sources, so this is a built profile rather than a stub. The
    CAMARA facts are recorded with the distinction between what is commercially launched
    (SIM Swap), what is merely announced (Number Verification), and what is callable from
    Airtel itself (nothing).
