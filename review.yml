  camara:
    posture: >-
      GSMA Open Gateway signatory and founding Aduna shareholder with one CAMARA API
      (SIM Swap) commercially launched through a federated bank channel — but nothing
      CAMARA is callable, specified, or documented on any Airtel host. Developers reach
      Airtel's network APIs only through aggregators (Aduna, Nokia Network as Code),
      never directly from Airtel.
    apisWithRealEvidence:
      - name: SIM Swap
        status: launched-commercially
        evidence: >-
          GSMA press release, 9 October 2025: "Bharti Airtel, Reliance Jio and Vodafone
          Idea have already launched the SIM Swap API", sold to banks to block account
          takeover. Announced at India Mobile Congress 2025 as a GSMA-certified
          federated service across all three Indian operators.
        callableFromAirtel: false
        specPublishedByAirtel: false
    apisAnnouncedNotVerified:
      - name: Number Verification
        status: announced-only
        evidence: >-
          Same GSMA release states all three operators "plan to launch a CAMARA-based
          Number Verification API before the end of 2025." No Airtel endpoint,
          specification, or documentation was found confirming it went live. Recorded
          as an announcement, not an implementation.
    openGatewayMember: true
    openGatewayEvidence: >-
      Bharti Airtel was among the 21 founding carriers of GSMA Open Gateway announced at
      MWC in February 2023, and is named as a participating operator in the GSMA's
      October 2025 India federated-network-services announcement.
    aduna:
      participant: true
      role: founding operator shareholder
      evidence: >-
        Aduna was formed in July 2025 as a joint venture between Ericsson and 12 global
        operators including Bharti Airtel, aggregating CAMARA network APIs into a single
        commercial channel. Aduna stated API services would become available in India
        "in the coming months".
    otherAggregatorChannels:
      - name: Nokia Network as Code
        note: >-
          Nokia and Bharti Airtel announced a partnership to expose Airtel's India-wide
          network APIs — latency insight, bandwidth control, location-aware functions
          across Airtel's 5G, AI and edge footprint — through NOKIA's developer portal
          on a subscription basis. The API documentation, testing tools and integration
          resources live with Nokia, not Airtel.
    pressReleaseOnly: false
    pressReleaseNote: >-
      This is stronger than a press release — SIM Swap is genuinely in commercial use.
      But it is materially weaker than a developer surface: Airtel publishes no CAMARA
      OpenAPI, exposes no CAMARA host, and offers no way for a developer to discover,
      read about, or call a CAMARA API from anything Airtel operates. The distinction
      matters and is recorded deliberately.
    camaraProjectGitHub: >-
      Bharti Airtel is not listed as a participant or contributor on the
      github.com/camaraproject organisation page.
    airtelOwnedLocationApiIsNotCamara: >-
      Airtel Locate is a real, publicly specified, consent-gated network location API —
      but it is Airtel's own proprietary product with its own path scheme
      (/locate/apis/customers/{customerBaId}/resources/{msisdn}/location). It is NOT the
      CAMARA DeviceLocation or LocationVerification API and must not be counted as one.
  tmForum:
    conformanceFound: false
    note: >-
      No TM Forum Open API conformance certification was found for Bharti Airtel, and no
      TMF-numbered API (TMF620, TMF622, TMF641, etc.) is published on any Airtel host.
      The legacy Smart API portal's client-side router still whitelists a public
      documentation route "/docs/Tmforum", but the corresponding content has been removed
      from the docs template — a dangling route, not an implementation. Recorded as a
      trace of an abandoned TM Forum intent, not as conformance.
  threeGppExposure:
    nefOrScef: not-published
    networkSlicing: not-published
    edgeMec: not-published
    note: >-
      No NEF or SCEF surface, network-slicing API, or edge/MEC API is publicly documented
      by Airtel. Nokia's Network as Code partnership describes latency-insight and
      bandwidth-control capabilities over Airtel's 5G footprint, but those are exposed
      and documented by Nokia.
  authModel:
    schemes:
      - product: Airtel IQ (SMS, Voice, CDR)
        scheme: HTTP Basic
        detail: >-
          "The Airtel IQ APIs use API keys to authenticate requests. Authentication to the
          API is performed via HTTP Basic Auth." Credentials are base64(username:password),
          managed in the IQ dashboard; all requests must be HTTPS. The published docs page
          performs its live "try it" call with an Authorization: Basic header.
      - product: Airtel IoT
        scheme: OAuth 2.0 client-credentials
        detail: >-
          POST /auth/v2/generate/authtoken with client_id and client_secret as
          application/x-www-form-urlencoded, plus POST /auth/v2/refresh/authtoken taking a
          refresh_token.
      - product: Airtel Locate
        scheme: OAuth 2.0 bearer token
        detail: >-
          POST /locate/apis/customers/{customerBaId}/oauth2_token, layered with an explicit
          per-MSISDN subscriber consent API that must be satisfied before location is returned.
      - product: Smart API (legacy)
        scheme: OAuth 2.0 authorization-code and implicit grants
        detail: >-
          Fully documented authorization-code and implicit flows with on-net vs off-net
          handling, scoped to payment:charge and subscription:activate.
    ciba:
      present: false
      note: >-
        CIBA (Client-Initiated Backchannel Authentication), which CAMARA specifies alongside
        OIDC for network-based authorization, does NOT appear anywhere in Airtel's public
        surface — not in any harvested specification, not in any documentation page. Its
        absence is consistent with the finding that Airtel operates no first-party CAMARA
        authorization surface.
    wellKnown:
      - url: https://openapi.airtel.in/.well-known/openid-configuration
        status: 404
      - url: https://openapi.airtel.in/.well-known/oauth-authorization-server
        status: 404
      - url: https://developers.airtel.in/.well-known/openid-configuration
        status: 200
        note: Returns the SPA HTML shell, not JSON — not an OIDC discovery document.
  webhooks:
    present: true
    asyncapiPublished: false
    events:
      - product: Airtel Locate
        detail: >-
          Asynchronous location mode requires the customer to "register the callback
          listener for the async API where Locate would post the location". A documented
          error state is "callback url is not registered".
      - product: Airtel IQ Voice
        detail: >-
          Inbound call flows post call information to enterprise-supplied endpoints;
          callflow configuration accepts callbackURLs, and enterprises may serve call-flow
          configuration back to Airtel during a live call.
    note: No AsyncAPI document is published for any Airtel event surface.
  graphql:
    present: false
    note: No /graphql surface was found on any Airtel host.
  grpc:
    present: false
    note: No published .proto files were found.
  postman:
    publicWorkspace: false
    note: >-
      Airtel IQ documentation references a "Postman Integration button" inside the
      authenticated outbound-callflow dashboard. No public Postman workspace or published
      collection was found.
  sdks:
    firstParty: []
    note: >-
      No first-party Airtel SDK was found on npm or PyPI. The PyPI package "airtel" is
      third-party (author rivo2302, an Airtel Money Africa wrapper). The GitHub organisation
      "airtelindia" exists but was created 2025-11-13, has no name or description, and holds
      a single unrelated repository — it is not a developer-facing presence. GitHub
      organisations "airtel", "bharti-airtel" and "airtel-digital" return 404.
  channelToDevelopers: >-
    Split. For CPaaS, IoT and Locate, Airtel reaches developers directly through its own
    public documentation and a self-serve CPaaS trial. For network APIs — the capability
    only a carrier can sell — Airtel reaches developers exclusively through aggregators:
    Aduna for CAMARA, Nokia Network as Code for 5G/edge/latency, and a GSMA-certified
    federated operator channel for SIM Swap. This is the central sector finding, and Airtel
    is a clean instance of it.
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://iqsms.airtel.in/api/v1
      documented: true
      note: Airtel IQ SMS.
    - protocol: REST
      scheme: https
      baseURL: https://m2m.airteliot.co.in/iot/api/
      documented: true
      note: Airtel IoT connectivity management.
    - protocol: REST
      scheme: https
      baseURL: https://openapi.airtel.in/locate/apis
      documented: true
      note: Airtel Locate device location and consent.
    - protocol: REST
      scheme: https
      baseURL: https://openapi.airtel.in/gateway/airtel-xchange-reporting/v2
      documented: true
      note: Airtel IQ CDR reporting.
    - protocol: Webhook
      scheme: https
      documented: true
      note: Customer-registered callback listeners for async Locate and inbound IQ voice call flows.
    - protocol: GraphQL
      documented: false
    - protocol: gRPC
      documented: false
    - protocol: WebSocket
      documented: false
