  scopes: scopes/bharti-airtel-scopes.yml
  errors: errors/bharti-airtel-problem-types.yml
  lifecycle: lifecycle/bharti-airtel-lifecycle.yml
  webhooks: asyncapi/bharti-airtel-webhooks.yml
