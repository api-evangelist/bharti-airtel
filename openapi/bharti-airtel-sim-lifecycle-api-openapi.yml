          content: {}
        '500':
          description: Internal Server Error.
          content: {}
      deprecated: false
      x-codegen-request-body-name: generateOrder
components:
  schemas:
    GenerateOrderWithPlan:
      title: GenerateOrderWithPlan
      required:
      - simDOList
      type: object
      properties:
        simDOList:
          type: array
          description: List of SIM
          items:
            $ref: '#/components/schemas/SimDOWithPlan'
    SwapSim:
      title: SwapSim
      type: object
      properties:
        existingSIMNo:
          type: string
        newSIMNo:
          type: string
    SimDO:
      title: SimDO
      required:
      - mobileNO
      type: object
      properties:
        mobileNO:
          type: string
          description: Mobile No.
    GeneratedTempDisconnectOrder:
      title: GeneratedTempDisconnectOrder
      required:
      - reason
      - simDOList
      type: object
      properties:
        reason:
          type: string
          description: Disconnection Reason.
          enum:
          - NUMBER_NOT_REQUIRED
          - PRICING_CONCERN
          - NETWORK_COVERAGE_ISSUE
          - BILLING_OR_COLLECTION_ISSUE
          - CONTRACT_EXPIRED
        simDOList:
          type: array
          description: List of SIM
          items:
            $ref: '#/components/schemas/SimDO'
    GenerateOrder:
      title: GenerateOrder
      required:
      - simDOList
      type: object
      properties:
        simDOList:
          type: array
          description: List of SIM
          items:
