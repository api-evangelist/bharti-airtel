          content: {}
      deprecated: false
      x-codegen-request-body-name: generateOrder
components:
  schemas:
    GeneratedTempDisconnectOrder:
      title: GeneratedTempDisconnectOrder
      required:
      - reason
      - simDOList
      type: object
      properties:
        reason:
          type: string
          description: Disconnection Reason.
          enum:
          - NUMBER_NOT_REQUIRED
          - PRICING_CONCERN
          - NETWORK_COVERAGE_ISSUE
          - BILLING_OR_COLLECTION_ISSUE
          - CONTRACT_EXPIRED
        simDOList:
          type: array
          description: List of SIM
          items:
            $ref: '#/components/schemas/SimDO'
    GenerateOrder:
      title: GenerateOrder
      required:
      - simDOList
      type: object
      properties:
        simDOList:
          type: array
          description: List of SIM
          items:
            $ref: '#/components/schemas/SimDO'
    SimDO:
      title: SimDO
      required:
      - mobileNO
      type: object
      properties:
        mobileNO:
          type: string
          description: Mobile No.
    SwapSim:
      title: SwapSim
      type: object
      properties:
        existingSIMNo:
          type: string
        newSIMNo:
          type: string
    SimDOWithPlan:
      title: SimDOWithPlan
      required:
      - mobileNO
      type: object
      properties:
        mobileNO:
          type: string
          description: Mobile No.
        planDO:
          $ref: '#/components/schemas/PlanDO'
    JobVO:
      title: JobVO
      type: object
      properties:
        errorFileName:
          type: string
          description: Error File Name
        errorItemsCount:
          type: integer
          description: Count of Error items in uploaded file.
          format: int32
        failureCount:
          type: integer
          description: Failure Order Count
          format: int32
        inProgressCount:
          type: integer
          description: In Progress Order Count
          format: int32
        jobId:
          type: integer
          description: Job ID, in case a particular Job ID to be fetched
          format: int64
        jobType:
          type: string
          description: Job Type as defined in CMP
        orderCompletionTime:
          type: string
          description: End Date in a date range to fetch Job IDs
        orderCount:
          type: integer
          description: Order Count
          format: int32
        orderInitiateDate:
          type: string
          description: Start Date in a date range to fetch Job IDs
        rejectedCount:
          type: integer
          description: Rejected Order Count
          format: int32
        requestedOrderItems:
          type: integer
          description: Count of items requested in uploaded file.
          format: int32
        statusCode:
          type: string
          description: Job Status Code
        statusMessage:
          type: string
          description: Status of Job IDs
        successCount:
          type: integer
          description: Success Order Count
          format: int32
        uploadFileName:
          type: string
          description: Upload File Name
    GenerateOrderWithPlan:
      title: GenerateOrderWithPlan
      required:
      - simDOList
      type: object
      properties:
        simDOList:
          type: array
          description: List of SIM
          items:
            $ref: '#/components/schemas/SimDOWithPlan'
    PlanDO:
      title: PlanDO
      required:
      - planCode
      type: object
      properties:
        planCode:
          type: string
          description: Plan Code
